<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mastery AI</title>
  <meta name="description" content="Mastery AI — continuous, AI-powered leadership development by Mastery Inside.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <a class="wordmark" href="#/home" aria-label="Mastery AI home">mastery<span class="wm-ai">a<span class="wm-i">ı</span></span></a>
      <button class="icon-btn plain collapse-btn" id="collapse" aria-label="Collapse sidebar" data-icon="panel"></button>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#/home" data-icon="compass"><span class="lbl">Discover</span></a>
      <a href="#/coach" data-icon="chat"><span class="lbl">AI Coach</span></a>
      <a href="#/assessment" data-icon="target"><span class="lbl">Leadership assessment</span></a>
      <a href="#/roleplay" data-icon="users"><span class="lbl">RolePlay Studio</span></a>
      <a href="#/journey" data-icon="route"><span class="lbl">My 90-day journey</span></a>
      <a href="#/feedback" data-icon="globe"><span class="lbl">360° feedback</span></a>
      <span class="nav-sep" role="separator"></span>
      <a href="#/console" data-icon="clipboard"><span class="lbl">Coach console</span></a>
      <a href="#/dashboard" data-icon="chart"><span class="lbl">Leadership dashboard</span></a>
      <a href="#/leads" data-icon="briefcase"><span class="lbl">Leads &amp; proposals</span></a>
    </nav>
    <div class="side-foot">
      <a class="level" href="#/journey"><span class="level-ring">38</span><span class="lbl">Day 38 of 90</span></a>
      <div class="me"><span class="avatar" id="side-avatar">PS</span><span class="lbl"><b id="side-name">Priya Sharma</b><small id="side-org">Acme Industries</small></span></div>
      <div class="foot-links lbl">
        <button id="theme" class="foot-btn" type="button">Dark mode</button>
        <button id="reset" class="foot-btn" type="button">Reset sample data</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button id="menu" class="icon-btn plain only-mobile" aria-label="Open menu" data-icon="menu"></button>
      <button id="back" class="icon-btn plain" aria-label="Back" data-icon="back" hidden></button>
      <button class="search" id="open-palette" type="button" aria-label="Search">
        <span data-icon="search"></span><span class="search-text">Search</span><kbd>⌘K</kbd>
      </button>
      <div class="top-actions">
        <div class="pop-wrap">
          <button id="bell" class="icon-btn plain" aria-label="Notifications" aria-expanded="false" data-icon="bell"></button>
          <span class="bell-dot" id="bell-dot"></span>
          <div class="popover" id="notifications" hidden></div>
        </div>
        <a class="btn primary" id="cta" href="#/coach" data-icon="sparkle"><span class="hide-sm">Talk to your coach</span></a>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <a class="launcher" id="launcher" href="#/coach" aria-label="Open AI Coach" data-icon="chat"></a>

  <div class="palette" id="palette" hidden>
    <div class="palette-box" role="dialog" aria-modal="true" aria-label="Search">
      <div class="palette-input"><span data-icon="search"></span><input id="palette-q" placeholder="Search pages, scenarios and actions…" autocomplete="off" aria-label="Search"><kbd>Esc</kbd></div>
      <ul class="palette-list" id="palette-list" role="listbox"></ul>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
